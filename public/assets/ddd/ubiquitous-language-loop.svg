<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="language-title language-desc">
  <title id="language-title">统一语言持续精炼反馈环</title>
  <desc id="language-desc">领域专家和开发团队通过对话与示例形成统一语言，语言进入领域模型、代码与测试，再以运行反馈持续修正语言。</desc>
  <defs><marker id="language-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" class="arrow-fill"/></marker></defs>
  <style>
    .bg{fill:#f4f8fc}.heading{font:700 36px system-ui,sans-serif;fill:#102a43}.sub{font:600 22px system-ui,sans-serif;fill:#486581}.label{font:700 23px system-ui,sans-serif;fill:#102a43}.small{font:600 20px system-ui,sans-serif;fill:#486581}.card{fill:#fff;stroke:#1d4e89;stroke-width:3}.domain{fill:#e4f5f3;stroke:#147d74;stroke-width:3}.decision{fill:#fff2cf;stroke:#b7791f;stroke-width:3}.line{fill:none;stroke:#1d4e89;stroke-width:4;marker-end:url(#language-arrow)}.feedback{fill:none;stroke:#147d74;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#language-arrow)}.arrow-fill{fill:#1d4e89}.bad{fill:#fff5f5;stroke:#c53030;stroke-width:2}.badtext{fill:#9b2c2c;font:700 20px system-ui,sans-serif}@media(prefers-color-scheme:dark){.bg{fill:#071827}.heading,.label{fill:#edf6ff}.sub,.small{fill:#b9cce0}.card{fill:#0d253a;stroke:#78aee8}.domain{fill:#0b302f;stroke:#55c7b8}.decision{fill:#3a2b0d;stroke:#e9b75c}.bad{fill:#38181c;stroke:#ff8585}.badtext{fill:#ffabab}.line{stroke:#82b7ee}.feedback{stroke:#55c7b8}.arrow-fill{fill:#82b7ee}}
  </style>
  <rect class="bg" width="1200" height="820" rx="24"/><text class="heading" x="60" y="66">统一语言：在协作与代码之间持续精炼</text><text class="sub" x="60" y="104">词汇只有进入模型、代码和测试，并能被业务验证，才真正“统一”</text>
  <g><rect class="card" x="65" y="190" width="190" height="110" rx="18"/><text class="label" x="160" y="238" text-anchor="middle">领域专家</text><text class="small" x="160" y="272" text-anchor="middle">规则与例外</text>
    <rect class="card" x="65" y="390" width="190" height="110" rx="18"/><text class="label" x="160" y="438" text-anchor="middle">开发团队</text><text class="small" x="160" y="472" text-anchor="middle">实现与反馈</text>
    <rect class="decision" x="345" y="260" width="190" height="150" rx="18"/><text class="label" x="440" y="310" text-anchor="middle">对话 / 示例</text><text class="small" x="440" y="347" text-anchor="middle">场景、规则</text><text class="small" x="440" y="380" text-anchor="middle">反例与边界</text>
    <rect class="domain" x="625" y="260" width="190" height="150" rx="18"/><text class="label" x="720" y="320" text-anchor="middle">统一语言</text><text class="small" x="720" y="360" text-anchor="middle">同词同义</text>
    <rect class="domain" x="905" y="180" width="220" height="120" rx="18"/><text class="label" x="1015" y="230" text-anchor="middle">领域模型</text><text class="small" x="1015" y="265" text-anchor="middle">行为与不变量</text>
    <rect class="card" x="905" y="390" width="220" height="120" rx="18"/><text class="label" x="1015" y="440" text-anchor="middle">代码与测试</text><text class="small" x="1015" y="475" text-anchor="middle">可执行词汇</text>
    <path class="line" d="M255 245C300 245 305 300 337 315"/><path class="line" d="M255 445C300 445 305 390 337 372"/><path class="line" d="M535 335H617"/><path class="line" d="M815 310L897 260"/><path class="line" d="M1015 300V382"/><path class="feedback" d="M905 470C705 590 360 590 178 508"/>
  </g>
  <g transform="translate(95 635)"><rect class="bad" width="295" height="110" rx="18"/><text class="badtext" x="148" y="48" text-anchor="middle">含糊：CRUD “更新订单”</text><text class="small" x="148" y="82" text-anchor="middle">没有表达业务意图</text><path class="line" d="M305 55H380"/><rect class="decision" x="390" width="615" height="110" rx="18"/><text class="label" x="698" y="44" text-anchor="middle">精炼：“提交订单” → 待支付 → 已确认</text><text class="small" x="698" y="80" text-anchor="middle">显式动作 + 业务状态 + 允许的状态迁移</text></g>
</svg>
