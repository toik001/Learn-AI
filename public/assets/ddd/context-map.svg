<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="contextmap-title contextmap-desc">
  <title id="contextmap-title">订单系统限界上下文关系图</title>
  <desc id="contextmap-desc">订单、支付、库存与商品目录四个限界上下文通过客户供应商、防腐层、开放主机服务与发布语言、遵奉者等模式建立明确的上下游关系。</desc>
  <defs>
    <marker id="contextmap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" class="arrow-fill"/></marker>
    <marker id="contextmap-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" class="teal-fill"/></marker>
  </defs>
  <style>
    .bg{fill:#f4f8fc}.heading{font:700 36px system-ui,sans-serif;fill:#102a43}.label{font:700 25px system-ui,sans-serif;fill:#102a43}.small{font:600 20px system-ui,sans-serif;fill:#486581}.context{fill:#fff;stroke:#1d4e89;stroke-width:4}.order{fill:#e4f5f3;stroke:#147d74;stroke-width:4}.relation{fill:#fff2cf;stroke:#b7791f;stroke-width:2}.line{fill:none;stroke:#1d4e89;stroke-width:4;marker-end:url(#contextmap-arrow)}.dashed{fill:none;stroke:#147d74;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#contextmap-teal-arrow)}.arrow-fill{fill:#1d4e89}.teal-fill{fill:#147d74}.legend{fill:#fff;stroke:#829ab1;stroke-width:2}@media(prefers-color-scheme:dark){.bg{fill:#071827}.heading,.label{fill:#edf6ff}.small{fill:#b9cce0}.context,.legend{fill:#0d253a;stroke:#78aee8}.order{fill:#0b302f;stroke:#55c7b8}.relation{fill:#3a2b0d;stroke:#e9b75c}.line{stroke:#82b7ee}.dashed{stroke:#55c7b8}.arrow-fill{fill:#82b7ee}.teal-fill{fill:#55c7b8}}
  </style>
  <rect class="bg" width="1200" height="860" rx="24"/><text class="heading" x="60" y="66">上下文映射：明确谁影响谁，以及如何隔离变化</text><text class="small" x="60" y="104">箭头始终从上游（U）指向下游（D）；关系标签说明协作与翻译策略</text>
  <g><rect class="order" x="450" y="160" width="300" height="140" rx="22"/><text class="label" x="600" y="218" text-anchor="middle">订单上下文</text><text class="small" x="600" y="258" text-anchor="middle">核心模型 · 下游/客户</text>
    <rect class="context" x="70" y="370" width="280" height="140" rx="22"/><text class="label" x="210" y="428" text-anchor="middle">支付上下文</text><text class="small" x="210" y="468" text-anchor="middle">U：支付能力提供方</text>
    <rect class="context" x="460" y="530" width="280" height="140" rx="22"/><text class="label" x="600" y="588" text-anchor="middle">库存上下文</text><text class="small" x="600" y="628" text-anchor="middle">D：遵循订单契约</text>
    <rect class="context" x="850" y="370" width="280" height="140" rx="22"/><text class="label" x="990" y="428" text-anchor="middle">商品目录上下文</text><text class="small" x="990" y="468" text-anchor="middle">U：商品信息发布方</text>
  </g>
  <path class="line" d="M350 420C405 395 415 310 490 292"/><rect class="relation" x="82" y="275" width="300" height="70" rx="14"/><text class="small" x="232" y="306" text-anchor="middle">Customer / Supplier</text><text class="small" x="232" y="333" text-anchor="middle">支付 U → 订单 D</text>
  <path class="dashed" d="M850 440C790 430 785 312 710 292"/><rect class="relation" x="782" y="265" width="340" height="82" rx="14"/><text class="small" x="952" y="297" text-anchor="middle">Open Host Service</text><text class="small" x="952" y="325" text-anchor="middle">+ Published Language · U → D</text>
  <path class="line" d="M600 300V522"/><rect class="relation" x="765" y="545" width="335" height="82" rx="14"/><text class="small" x="932" y="577" text-anchor="middle">Conformist（遵奉者）</text><text class="small" x="932" y="605" text-anchor="middle">订单 U → 库存 D</text>
  <rect class="relation" x="80" y="545" width="340" height="78" rx="14"/><text class="small" x="250" y="577" text-anchor="middle">Anti-Corruption Layer</text><text class="small" x="250" y="605" text-anchor="middle">订单侧隔离支付模型</text>
  <g transform="translate(65 720)"><rect class="legend" width="1070" height="100" rx="18"/><text class="label" x="28" y="40">图例</text><path class="line" d="M130 34H220"/><text class="small" x="240" y="41">实线：直接依赖/协作</text><path class="dashed" d="M480 34H570"/><text class="small" x="590" y="41">虚线：公开契约</text><text class="small" x="28" y="76">U = Upstream 上游制定契约；D = Downstream 下游消费契约；ACL = 下游内部翻译层</text></g>
</svg>
