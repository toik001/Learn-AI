<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="adoption-title adoption-desc">
  <title id="adoption-title">DDD 证据驱动的落地演进路径</title>
  <desc id="adoption-desc">系统从事务脚本开始，识别业务热点后形成模块化单体边界，再在必要处建立富领域模型；只有通过独立变更节奏、数据所有权、团队自治和部署需要等决策门时才拆分微服务，CQRS 与事件溯源仅为可选分支。</desc>
  <defs><marker id="adoption-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" class="arrow-fill"/></marker></defs>
  <style>
    .bg{fill:#f4f8fc}.heading{font:700 36px system-ui,sans-serif;fill:#102a43}.label{font:700 22px system-ui,sans-serif;fill:#102a43}.small{font:600 20px system-ui,sans-serif;fill:#486581}.stage{fill:#fff;stroke:#1d4e89;stroke-width:3}.domain{fill:#e4f5f3;stroke:#147d74;stroke-width:3}.gate{fill:#fff2cf;stroke:#b7791f;stroke-width:3}.optional{fill:#edf2f7;stroke:#64748b;stroke-width:3;stroke-dasharray:9 6}.line{fill:none;stroke:#1d4e89;stroke-width:4;marker-end:url(#adoption-arrow)}.branch{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#adoption-arrow)}.arrow-fill{fill:#1d4e89}.note{fill:#fff;stroke:#147d74;stroke-width:3}@media(prefers-color-scheme:dark){.bg{fill:#071827}.heading,.label{fill:#edf6ff}.small{fill:#b9cce0}.stage,.note{fill:#0d253a}.stage{stroke:#78aee8}.domain{fill:#0b302f;stroke:#55c7b8}.gate{fill:#3a2b0d;stroke:#e9b75c}.optional{fill:#16283a;stroke:#9eb3c7}.line{stroke:#82b7ee}.branch{stroke:#9eb3c7}.arrow-fill{fill:#82b7ee}.note{stroke:#55c7b8}}
  </style>
  <rect class="bg" width="1400" height="920" rx="24"/><text class="heading" x="60" y="66">DDD 落地：复杂度与组织证据驱动演进</text><text class="small" x="60" y="104">先获得清晰边界和业务价值，再为必要的分布式成本买单</text>
  <g transform="translate(45 160)"><rect class="stage" width="190" height="130" rx="20"/><text class="label" x="95" y="54" text-anchor="middle">事务脚本</text><text class="small" x="95" y="90" text-anchor="middle">简单流程先交付</text>
    <rect class="gate" x="245" width="190" height="130" rx="20"/><text class="label" x="340" y="48" text-anchor="middle">识别业务热点</text><text class="small" x="340" y="84" text-anchor="middle">规则、变化、冲突</text><text class="small" x="340" y="112" text-anchor="middle">是否持续增加？</text>
    <rect class="stage" x="490" width="220" height="130" rx="20"/><text class="label" x="600" y="48" text-anchor="middle">模块化单体边界</text><text class="small" x="600" y="84" text-anchor="middle">模块、数据与语言</text><text class="small" x="600" y="112" text-anchor="middle">先在进程内隔离</text>
    <rect class="domain" x="765" width="205" height="130" rx="20"/><text class="label" x="867" y="48" text-anchor="middle">富领域模型</text><text class="small" x="867" y="84" text-anchor="middle">只用于复杂热点</text><text class="small" x="867" y="112" text-anchor="middle">保护不变量</text>
    <rect class="gate" x="1025" width="250" height="130" rx="20"/><text class="label" x="1150" y="43" text-anchor="middle">only-if-needed</text><text class="label" x="1150" y="77" text-anchor="middle">微服务</text><text class="small" x="1150" y="108" text-anchor="middle">通过决策门才拆分</text>
    <path class="line" d="M190 65H237"/><path class="line" d="M435 65H482"/><path class="line" d="M710 65H757"/><path class="branch" d="M970 65H1017"/></g>
  <text class="label" x="700" y="365" text-anchor="middle">微服务拆分决策门 · 四项证据</text>
  <g transform="translate(100 405)"><rect class="gate" width="260" height="115" rx="18"/><text class="label" x="130" y="44" text-anchor="middle">独立变更节奏？</text><text class="small" x="130" y="80" text-anchor="middle">发布频率与路线不同</text>
    <rect class="gate" x="310" width="260" height="115" rx="18"/><text class="label" x="440" y="44" text-anchor="middle">清晰数据所有权？</text><text class="small" x="440" y="80" text-anchor="middle">能独立维护一致性</text>
    <rect class="gate" x="620" width="260" height="115" rx="18"/><text class="label" x="750" y="44" text-anchor="middle">团队自治需要？</text><text class="small" x="750" y="80" text-anchor="middle">端到端独立负责</text>
    <rect class="gate" x="930" width="260" height="115" rx="18"/><text class="label" x="1060" y="44" text-anchor="middle">独立部署需要？</text><text class="small" x="1060" y="80" text-anchor="middle">容量或风险隔离</text></g>
  <rect class="note" x="275" y="570" width="850" height="85" rx="18"/><text class="label" x="700" y="606" text-anchor="middle">证据不足：保留模块化单体，继续采集变更与运行数据</text><text class="small" x="700" y="638" text-anchor="middle">分布式事务、网络故障与可观测性不是免费的</text>
  <path class="branch" d="M600 655V700H420V742"/><path class="branch" d="M800 655V700H980V742"/>
  <rect class="optional" x="265" y="750" width="310" height="105" rx="18"/><text class="label" x="420" y="794" text-anchor="middle">可选：CQRS</text><text class="small" x="420" y="829" text-anchor="middle">读写模型确有不同需求时</text>
  <rect class="optional" x="825" y="750" width="310" height="105" rx="18"/><text class="label" x="980" y="794" text-anchor="middle">可选：Event Sourcing</text><text class="small" x="980" y="829" text-anchor="middle">需要完整历史与重放时</text>
  <text class="small" x="700" y="890" text-anchor="middle">虚线分支是工具选择，不是 DDD 成熟度必经阶段</text>
</svg>
