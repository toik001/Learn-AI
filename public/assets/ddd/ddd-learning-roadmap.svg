<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="roadmap-title roadmap-desc">
  <title id="roadmap-title">DDD 七阶段学习路线</title>
  <desc id="roadmap-desc">路线从总览开始，依次学习基础概念、战略设计、战术设计、分层架构、Java 实践与落地演进，并从实践反馈到统一语言和边界复盘。</desc>
  <defs><marker id="roadmap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" class="arrow-fill"/></marker></defs>
  <style>
    .bg{fill:#f4f8fc}.heading{font:700 36px system-ui,sans-serif;fill:#102a43}.sub{font:600 22px system-ui,sans-serif;fill:#486581}.num{font:800 30px system-ui,sans-serif;fill:#fff}.label{font:700 22px system-ui,sans-serif;fill:#102a43}.small{font:600 20px system-ui,sans-serif;fill:#486581}.card{fill:#fff;stroke:#1d4e89;stroke-width:3}.circle{fill:#1d4e89}.domain{fill:#e4f5f3;stroke:#147d74;stroke-width:3}.decision{fill:#fff2cf;stroke:#b7791f;stroke-width:3}.line{fill:none;stroke:#1d4e89;stroke-width:4;marker-end:url(#roadmap-arrow)}.feedback{fill:none;stroke:#147d74;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#roadmap-arrow)}.arrow-fill{fill:#1d4e89}@media(prefers-color-scheme:dark){.bg{fill:#071827}.heading,.label{fill:#edf6ff}.sub,.small{fill:#b9cce0}.card{fill:#0d253a;stroke:#78aee8}.circle{fill:#2869a8}.domain{fill:#0b302f;stroke:#55c7b8}.decision{fill:#3a2b0d;stroke:#e9b75c}.line{stroke:#82b7ee}.feedback{stroke:#55c7b8}.arrow-fill{fill:#82b7ee}}
  </style>
  <rect class="bg" width="1200" height="780" rx="24"/>
  <text class="heading" x="60" y="66">DDD 七阶段学习路线</text><text class="sub" x="60" y="104">每一站形成一个可验证的理解，再把落地证据带回模型</text>
  <path class="line" d="M185 242H267M435 242H517M685 242H767M935 242H1017"/>
  <path class="line" d="M1095 316V401M1015 475H933M765 475H683"/>
  <g transform="translate(45 170)"><rect class="card" width="140" height="145" rx="18"/><circle class="circle" cx="70" cy="42" r="27"/><text class="num" x="70" y="52" text-anchor="middle">1</text><text class="label" x="70" y="101" text-anchor="middle">总览</text><text class="small" x="70" y="130" text-anchor="middle">地图与路线</text></g>
  <g transform="translate(295 170)"><rect class="card" width="140" height="145" rx="18"/><circle class="circle" cx="70" cy="42" r="27"/><text class="num" x="70" y="52" text-anchor="middle">2</text><text class="label" x="70" y="101" text-anchor="middle">基础概念</text><text class="small" x="70" y="130" text-anchor="middle">统一语言</text></g>
  <g transform="translate(545 170)"><rect class="card" width="140" height="145" rx="18"/><circle class="circle" cx="70" cy="42" r="27"/><text class="num" x="70" y="52" text-anchor="middle">3</text><text class="label" x="70" y="101" text-anchor="middle">战略设计</text><text class="small" x="70" y="130" text-anchor="middle">边界与协作</text></g>
  <g transform="translate(795 170)"><rect class="domain" width="140" height="145" rx="18"/><circle class="circle" cx="70" cy="42" r="27"/><text class="num" x="70" y="52" text-anchor="middle">4</text><text class="label" x="70" y="101" text-anchor="middle">战术设计</text><text class="small" x="70" y="130" text-anchor="middle">模型构件</text></g>
  <g transform="translate(1045 170)"><rect class="card" width="140" height="145" rx="18"/><circle class="circle" cx="70" cy="42" r="27"/><text class="num" x="70" y="52" text-anchor="middle">5</text><text class="label" x="70" y="101" text-anchor="middle">分层架构</text><text class="small" x="70" y="130" text-anchor="middle">依赖方向</text></g>
  <g transform="translate(795 402)"><rect class="card" width="140" height="145" rx="18"/><circle class="circle" cx="70" cy="42" r="27"/><text class="num" x="70" y="52" text-anchor="middle">6</text><text class="label" x="70" y="101" text-anchor="middle">Java 实践</text><text class="small" x="70" y="130" text-anchor="middle">订单用例</text></g>
  <g transform="translate(1045 402)"><rect class="decision" width="140" height="145" rx="18"/><circle class="circle" cx="70" cy="42" r="27"/><text class="num" x="70" y="52" text-anchor="middle">7</text><text class="label" x="70" y="101" text-anchor="middle">落地演进</text><text class="small" x="70" y="130" text-anchor="middle">证据驱动</text></g>
  <rect class="domain" x="310" y="616" width="360" height="92" rx="18"/><text class="label" x="490" y="656" text-anchor="middle">统一语言 / 边界复盘</text><text class="small" x="490" y="688" text-anchor="middle">把生产反馈变成下一轮建模输入</text>
  <path class="feedback" d="M1115 547V662H679"/><text class="small" x="805" y="645">反馈：演进不是终点</text>
</svg>
