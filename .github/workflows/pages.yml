name: Deploy knowledge base to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify entry files and JavaScript syntax
        run: |
          test -s public/index.html
          node --check scripts/build-html-index.mjs
          node --check scripts/verify-site.mjs
          node --check public/assets/app.js

      - name: Run content regression tests
        run: |
          set -euo pipefail
          for test_file in scripts/test-*.mjs; do
            node "$test_file"
          done

      - name: Verify static site integrity
        run: node scripts/verify-site.mjs

      - name: Verify generated navigation is committed
        run: |
          node scripts/build-html-index.mjs
          git diff --exit-code -- public

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
